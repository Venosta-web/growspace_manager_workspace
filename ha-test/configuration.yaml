---
# Home Assistant — Growspace CLEAN/RELEASE-TEST instance
#
# Purpose: verify a *real HACS installation* of both repos against a virgin
# config. Nothing from this repo is bind-mounted into custom_components here —
# that is deliberate. If it works here, it works for your users.
#
# Host path: ~/dev/growspace_manager_workspace/ha-test/configuration.yaml
# Served on: http://localhost:8124

default_config:

homeassistant:
  name: Growspace Release Test
  # A release verification is driven from this host, and the password of the
  # user that onboarding minted is a random string nobody kept. Trusted
  # networks let the run reach the dashboard without one — which matters
  # because the browser is the only place the card can be checked at all.
  # The addresses are the loopback pair and Docker's bridge range, which is
  # how the container sees a connection from the host; Compose binds 8124 to
  # loopback, so nothing on the LAN is on the other side of this.
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
        - 172.16.0.0/12
      allow_bypass_login: true
    - type: homeassistant
  time_zone: Europe/Berlin
  unit_system: metric
  currency: EUR
  country: DE
  # The same pin ha-dev carries, and for the same reason: unset, Home Assistant
  # in Docker defaults the "local" media dir to /media, which is root-owned in
  # the image while HA runs as 1000. The Vision Evidence Store then cannot
  # create its image root, every start logs `Failed to open the Vision Evidence
  # Store` with a PermissionError, and a release test reads as broken over
  # something no release test is asking about. `vol.IsDir()` validates this at
  # config load, so ha-test/media/ has to exist — hence its tracked .gitkeep.
  media_dirs:
    local: /config/media

# There is deliberately no `http:` block here any more. It declared this same
# bridge range as a trusted proxy, and Home Assistant refuses a trusted-network
# login from an address that is also a trusted proxy — it cannot tell the
# client's own address from one a proxy claims. Nothing sits in front of this
# instance: the connection arrives straight through Docker's published port.

logger:
  default: warning
  logs:
    custom_components.growspace_manager: debug
    # scripts/card-hacs-update drives HACS from the outside, and HACS reports
    # most of its refusals as frontend events rather than log lines. Debug here
    # is the only place a failed download or registration explains itself.
    custom_components.hacs: debug

# NOTE: no `lovelace.resources` block here on purpose — the HACS install flow
# must register the resource itself. If the card only works when you hand-add
# the resource, that is a packaging bug worth catching before release.
lovelace:
  mode: storage

recorder:
  purge_keep_days: 1

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
