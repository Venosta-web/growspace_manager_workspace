  # ---------------------------------------------------------------
  # percentage fans (state and percentage backed by helpers)
  # ---------------------------------------------------------------
  - fan:
      - name: e2e climate plain circulation fan percentage
        unique_id: e2e_climate_plain_circulation_fan_percentage
        state: "{{ is_state('input_boolean.e2e_climate_plain_circulation_fan_percentage', 'on') }}"
        percentage: "{{ states('input_number.e2e_climate_plain_circulation_fan_percentage_value') | int(0) }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.e2e_climate_plain_circulation_fan_percentage
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.e2e_climate_plain_circulation_fan_percentage
          - action: input_number.set_value
            target:
              entity_id: input_number.e2e_climate_plain_circulation_fan_percentage_value
            data:
              value: 0
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.e2e_climate_plain_circulation_fan_percentage_value
            data:
              value: "{{ percentage }}"
          - choose:
              - conditions: "{{ percentage | int(0) > 0 }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.e2e_climate_plain_circulation_fan_percentage
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.e2e_climate_plain_circulation_fan_percentage
      - name: e2e climate plain exhaust fan percentage
        unique_id: e2e_climate_plain_exhaust_fan_percentage
        state: "{{ is_state('input_boolean.e2e_climate_plain_exhaust_fan_percentage', 'on') }}"
        percentage: "{{ states('input_number.e2e_climate_plain_exhaust_fan_percentage_value') | int(0) }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.e2e_climate_plain_exhaust_fan_percentage
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.e2e_climate_plain_exhaust_fan_percentage
          - action: input_number.set_value
            target:
              entity_id: input_number.e2e_climate_plain_exhaust_fan_percentage_value
            data:
              value: 0
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.e2e_climate_plain_exhaust_fan_percentage_value
            data:
              value: "{{ percentage }}"
          - choose:
              - conditions: "{{ percentage | int(0) > 0 }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.e2e_climate_plain_exhaust_fan_percentage
            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.e2e_climate_plain_exhaust_fan_percentage
  # ---------------------------------------------------------------
  # aggregate light-state sensors used by automatic cycle tracking
  # ---------------------------------------------------------------
  - binary_sensor:
      - name: e2e lighting light state
        unique_id: e2e_lighting_light_state
        device_class: light
        state: "{{ is_state('switch.e2e_lighting_growlight_switch', 'on') or is_state('light.e2e_lighting_growlight_dimmable', 'on') }}"
  # ---------------------------------------------------------------
  # dimmable lights (state and level backed by helpers)
  # ---------------------------------------------------------------
  - light:
      - name: e2e lighting growlight dimmable
        unique_id: e2e_lighting_growlight_dimmable
        state: "{{ is_state('input_boolean.e2e_lighting_growlight_dimmable', 'on') }}"
        level: "{{ states('input_number.e2e_lighting_growlight_dimmable_brightness') | int(128) }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.e2e_lighting_growlight_dimmable
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.e2e_lighting_growlight_dimmable
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.e2e_lighting_growlight_dimmable_brightness
            data:
              value: "{{ brightness }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.e2e_lighting_growlight_dimmable

input_boolean:
  sim_e2e_veg_irrigation_pump:
    name: sim e2e veg irrigation_pump
    initial: false
  sim_e2e_clone_irrigation_pump:
    name: sim e2e clone irrigation_pump
    initial: false
  sim_e2e_mother_irrigation_pump:
    name: sim e2e mother irrigation_pump
    initial: false
  sim_e2e_flower_irrigation_pump:
    name: sim e2e flower irrigation_pump
