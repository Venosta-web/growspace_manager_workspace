generic_hygrostat:
  - name: e2e climate plain humidifier native
    unique_id: e2e_climate_plain_humidifier_native
    humidifier: input_boolean.e2e_climate_plain_humidifier_native
    target_sensor: input_number.e2e_climate_plain_humidity
    device_class: humidifier
    target_humidity: 50
    dry_tolerance: 0.5
    wet_tolerance: 0.5
    initial_state: false
  - name: e2e climate plain dehumidifier native
    unique_id: e2e_climate_plain_dehumidifier_native
    humidifier: input_boolean.e2e_climate_plain_dehumidifier_native
    target_sensor: input_number.e2e_climate_plain_humidity
    device_class: dehumidifier
    target_humidity: 60
    dry_tolerance: 0.5
    wet_tolerance: 0.5
    initial_state: false

ac_infinity:
  entities:
    - entity_id: select.e2e_ac_infinity_circulation_active_mode
      translation_key: active_mode
      device_key: e2e_ac_infinity_circulation
      device_name: E2E AC Infinity Circulation Port
    - entity_id: number.e2e_ac_infinity_circulation_speed
      translation_key: on_power
      device_key: e2e_ac_infinity_circulation
      device_name: E2E AC Infinity Circulation Port
    - entity_id: select.e2e_ac_infinity_exhaust_active_mode
      translation_key: active_mode
      device_key: e2e_ac_infinity_exhaust
      device_name: E2E AC Infinity Exhaust Port
    - entity_id: number.e2e_ac_infinity_exhaust_speed
      translation_key: on_power
      device_key: e2e_ac_infinity_exhaust
      device_name: E2E AC Infinity Exhaust Port
    - entity_id: select.e2e_ac_infinity_humidifier_active_mode
      translation_key: active_mode
      device_key: e2e_ac_infinity_humidifier
      device_name: E2E AC Infinity Humidifier Port
    - entity_id: number.e2e_ac_infinity_humidifier_speed
      translation_key: on_power
      device_key: e2e_ac_infinity_humidifier
      device_name: E2E AC Infinity Humidifier Port
    - entity_id: select.e2e_ac_infinity_dehumidifier_active_mode
      translation_key: active_mode
      device_key: e2e_ac_infinity_dehumidifier
      device_name: E2E AC Infinity Dehumidifier Port
    - entity_id: number.e2e_ac_infinity_dehumidifier_speed
      translation_key: on_power
      device_key: e2e_ac_infinity_dehumidifier
      device_name: E2E AC Infinity Dehumidifier Port
    - entity_id: select.e2e_ac_infinity_growlight_active_mode
      translation_key: active_mode
      device_key: e2e_ac_infinity_growlight
      device_name: E2E AC Infinity Grow Light Port
    - entity_id: time.e2e_ac_infinity_growlight_on_time
      translation_key: schedule_mode_on_time
      device_key: e2e_ac_infinity_growlight
      device_name: E2E AC Infinity Grow Light Port
    - entity_id: time.e2e_ac_infinity_growlight_off_time
      translation_key: schedule_mode_off_time
      device_key: e2e_ac_infinity_growlight
      device_name: E2E AC Infinity Grow Light Port
    - entity_id: number.e2e_ac_infinity_growlight_on_power
      translation_key: on_power
      device_key: e2e_ac_infinity_growlight
      device_name: E2E AC Infinity Grow Light Port
    - entity_id: switch.e2e_ac_infinity_growlight_sunrise_enabled
      translation_key: sunrise_timer_enabled
      device_key: e2e_ac_infinity_growlight
      device_name: E2E AC Infinity Grow Light Port
    - entity_id: number.e2e_ac_infinity_growlight_sunrise_duration
      translation_key: sunrise_timer_minutes
      device_key: e2e_ac_infinity_growlight
      device_name: E2E AC Infinity Grow Light Port

script:
  e2e_reset_source_air:
    alias: E2E Reset Source Air
    description: Restore the documented neutral lung-room baseline
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.e2e_source_air_temperature
        data:
          value: 24
      - action: input_number.set_value
        target:
          entity_id: input_number.e2e_source_air_humidity
        data:
          value: 60
    mode: restart

