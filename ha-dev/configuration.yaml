# Home Assistant — Growspace DEV instance
#
# This file lives on the HOST at:
#   ~/dev/growspace_manager_workspace/ha-dev/configuration.yaml
# and is bind-mounted into the container at /config/configuration.yaml.
#
# Everything HA writes (.storage/, home-assistant.log, www/) is therefore
# readable and editable from the host by you, Claude Code, and Codex.

default_config:

homeassistant:
  name: Growspace Dev
  # Simulated e2e sensors live here; regenerate with ./scripts/gen-e2e-sensors
  packages: !include_dir_named packages
  time_zone: Europe/Berlin
  unit_system: metric
  currency: EUR
  country: DE
  # The Vision Evidence Store keeps its image corpus under the "local" media
  # dir. Unset, HA running in Docker defaults that to /media — root-owned in
  # the image, so HA (uid 1000) cannot create /media/growspace_vision and the
  # store fails to open with PermissionError, and the corpus would live only
  # inside the container anyway. Point it inside /config so the images land in
  # the ha-dev/ bind mount like everything else HA writes.
  #
  # `vol.IsDir()` validates this at config load, so ha-dev/media/ must exist —
  # that is what its tracked .gitkeep is for.
  media_dirs:
    local: /config/media

# Trust the Docker bridge so the browser + Playwright can reach HA without
# tripping the "invalid login attempt" IP ban during local development.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12
    - 127.0.0.1
    - ::1

# Verbose logging for our own integration only; everything else stays quiet.
logger:
  default: warning
  logs:
    custom_components.growspace_manager: debug
    homeassistant.components.websocket_api: info

# Lovelace in storage mode (edit via UI).
#
# Do NOT add a `resources:` block here. `lovelace.resources` is only honoured in
# YAML mode; in storage mode it is silently ignored and the card never loads.
# Resources live in .storage/lovelace_resources and are registered via the
# websocket API — see scripts/gen-e2e-dashboards.cjs.
lovelace:
  mode: storage

# Keep the recorder small and disposable — this is a dev box, not an archive.
recorder:
  db_url: "sqlite:////config/home-assistant_v2.db"
  purge_keep_days: 3
  commit_interval: 1

# Long-lived token creation for Playwright e2e is done in the UI:
#   Profile -> Security -> Long-lived access tokens
# then paste into lovelace-growspace-manager-card/tests/e2e/.env.test

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
