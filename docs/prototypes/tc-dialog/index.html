<!doctype html>
<!-- THROWAWAY: three TC dialog layouts in a simulated growspace dashboard; ?variant=A|B|C. No HA calls. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tissue Culture dialog · layout prototype</title>
<style>
:root{font:15px/1.45 Roboto,Arial,sans-serif;color:#e5e8eb;background:#101214;color-scheme:dark;--line:#41464b;--muted:#abb3bb;--accent:#81cafa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 16px;min-height:40px}button:hover{background:#323b43}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}h1{font-size:24px}h2{font-size:21px;margin:0}h3{font-size:17px;margin:0 0 6px}p{margin:4px 0 16px}small,.muted{color:var(--muted)}.appbar{padding:16px 28px;background:#202326}.dashboard{max-width:1000px;margin:35px auto;padding:24px}.growspace{border:1px solid var(--line);border-radius:14px;padding:24px;background:#1c1f22}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.plants{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.plant{padding:24px 16px;border:1px solid var(--line);border-radius:12px}.primary{color:#102735;background:var(--accent);border-color:transparent}.primary:hover{background:#a3dcff}dialog{padding:0;border:0;background:#202326;color:inherit;border-radius:16px;width:min(920px,calc(100vw - 48px));height:min(720px,calc(100dvh - 130px));max-height:none;max-width:none;box-shadow:0 24px 70px #0007;overflow:hidden;margin:24px auto}dialog::backdrop{background:#0009}.shell{height:100%;display:flex;flex-direction:column}.head{padding:22px 24px 14px;flex:none}.head p{font-size:13px;margin:3px 0 0}.close{border:0;font-size:21px;padding:4px 12px}.nav{display:flex;flex:none;border-bottom:1px solid var(--line);padding:0 20px;gap:6px}.nav button{border:0;border-radius:0;color:var(--muted);padding:12px 10px}.nav button[aria-current=true]{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}.content{padding:22px 24px;overflow:auto;flex:1;min-height:0;scrollbar-color:#697580 #202326;scrollbar-width:thin}.footer{padding:10px 24px;border-top:1px solid var(--line);font-size:12px;flex:none;color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.entry{padding:16px 0;border-bottom:1px solid var(--line)}.entry:first-of-type{border-top:1px solid var(--line)}.entry p{font-size:13px;color:var(--muted);margin:6px 0 10px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:13px;min-height:36px;padding:6px 12px}.badge{font-size:12px;color:#ffb6ae;border:1px solid #92605d;border-radius:12px;padding:2px 8px}.badge.due{color:#f5d28c;border-color:#8c774b}section+section{margin-top:36px}select,input,textarea{background:#181b1e;border:1px solid #69727a;border-radius:7px;padding:10px;max-width:100%;width:100%}select{width:auto}label{display:flex;flex-direction:column;gap:6px;margin:14px 0;font-size:13px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}.board .entry{min-width:0}.board h4{margin:0 0 12px;color:var(--muted)}.split{display:grid;grid-template-columns:180px minmax(0,1fr);flex:1;min-height:0}.split .nav{flex-direction:column;border:0;border-right:1px solid var(--line);padding:18px 12px}.split .nav button{text-align:left;border-radius:8px}.split .nav button[aria-current=true]{box-shadow:none;background:#293d4a}.split:has(.back){grid-template-columns:minmax(0,1fr)}.bench{display:grid;grid-template-columns:1fr 1fr;gap:24px}.details{background:#181b1e;padding:18px;border-radius:12px;align-self:start}.back{margin-bottom:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.notice{padding:10px 0;color:#b3dfbd}.switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#e8eef2;color:#14222b;border-radius:14px;padding:8px;display:flex;align-items:center;gap:12px;z-index:5;box-shadow:0 8px 28px #0005;width:max-content;max-width:calc(100vw - 20px)}.switcher button{border:0;color:inherit;min-width:38px;padding:4px 10px}.switcher button:hover{background:#cbdce6}.switcher strong{font-size:13px}.switcher small{color:#40515b;font-size:11px;display:block}.state{white-space:normal;max-width:520px;font-size:11px}.empty{padding:35px 0}.nested{width:min(530px,calc(100vw - 32px));height:auto;max-height:calc(100dvh - 150px);overflow:auto;margin:55px auto;padding:24px}.nested::backdrop{background:#0007}::selection{background:#81cafa;color:#102735}
@media(max-width:600px){.dashboard{margin:0;padding:16px}.plants{grid-template-columns:1fr}.plant:nth-child(n+2){display:none}dialog{width:100%;height:calc(100dvh - 96px);margin:0;border-radius:0}.head{padding:16px}.content{padding:18px 16px}.nav{padding:0 8px;gap:0}.nav button{flex:1;font-size:12px;padding:12px 4px}.footer{padding:8px 16px}.board{grid-template-columns:1fr}.split{display:flex;flex-direction:column}.split .nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:0 8px}.split .nav button{text-align:center}.bench{display:block}.bench .details{margin-top:18px}.formgrid{grid-template-columns:1fr}.switcher{bottom:6px;gap:3px}.switcher small{font-size:10px}.state{max-width:260px}.nested{margin:12px auto;border-radius:12px;max-height:calc(100dvh - 112px)}}
</style>
<header class="appbar">Growspace Manager</header><main class="dashboard"><p class="muted">Layout prototype · illustrative data · no changes to Home Assistant</p><div class="growspace"><div class="row"><h1>Propagation room</h1><button id="open">Tissue Culture</button></div><p class="muted">24.2 °C · 68% humidity · Lights on</p><div class="plants"><div class="plant"><h3>Blue Dream</h3>Vegetative · Day 18</div><div class="plant"><h3>OG Kush</h3>Vegetative · Day 12</div><div class="plant"><h3>Gelato</h3>Vegetative · Day 9</div></div></div></main>
<dialog id="tc" aria-labelledby="title"><div class="shell"><header class="head"><div class="row"><h2 id="title">Tissue Culture</h2><button class="close" id="close" aria-label="Close Tissue Culture">×</button></div><p class="muted">All cultures · opened from Propagation room</p></header><div id="layout" style="display:contents"></div><footer class="footer" id="foot"></footer><aside class="switcher" aria-label="Prototype controls"><button id="prev" aria-label="Previous layout">←</button><div><strong id="variantLabel"></strong><small id="rationale"></small><div class="state" id="state" aria-live="polite"></div></div><button id="next" aria-label="Next layout">→</button></aside></div></dialog>
<dialog id="child" class="nested" aria-label="Culture action"></dialog>
<script>
const $=s=>document.querySelector(s), tc=$('#tc'), child=$('#child');
const variants={A:['A · Stacked card','All sections in one scroll; actions overlay.'],B:['B · Tabbed dialog','Due work leads; actions stay in the same shell.'],C:['C · Workbench','Side navigation; work and vessel detail together.']};
let variant=new URLSearchParams(location.search).get('variant')||'B';if(!variants[variant])variant='B';
let tab='Worklist',action=null,selected=0,upcoming=false,locationFilter='',message='',returnScroll=0,returnButton=null;
const cultures=[{name:'Blue Dream #3',id:'BD-014',stage:'Multiplication',location:'Shelf A',due:'3 days overdue',n:8},{name:'OG Kush #1',id:'OG-008',stage:'Multiplication',location:'Shelf B',due:'Due today',n:5},{name:'Gelato #2',id:'GE-006',stage:'Rooting',location:'Shelf A',due:'Due today',n:6},{name:'Blue Dream #3',id:'BD-017',stage:'Introduction',location:'Shelf B',due:'In 12 days',n:3}];
const names=['Worklist','Cultures','Media','Pairings'];
function nav(){return `<nav class="nav" aria-label="Tissue Culture sections">${names.map(n=>`<button data-tab="${n}" aria-current="${tab===n}">${n}</button>`).join('')}</nav>`}
function entry(c,i,detail=false){return `<article class="entry"><div class="row"><h3>${c.name}</h3><span class="badge ${i?'due':''}">${c.due}</span></div><p>${c.id} · ${c.stage} · ${c.location} · ${c.n} plantlets</p><div class="actions">${detail?`<button data-select="${i}">View vessel</button>`:`<button data-action="replate" data-id="${i}">Replate</button><button data-action="note" data-id="${i}">Add note</button>`}</div></article>`}
function worklist(){return `<section><h3>Worklist</h3><p class="muted">Replate vessels that are due or overdue.</p><div class="toolbar"><select id="location" aria-label="Filter by location"><option value="">All locations</option>${['Shelf A','Shelf B'].map(l=>`<option ${locationFilter===l?'selected':''}>${l}</option>`).join('')}</select><button id="upcoming" aria-pressed="${upcoming}">${upcoming?'Only due':'Show upcoming'}</button></div>${cultures.map((c,i)=>(upcoming||i<3)&&(!locationFilter||c.location===locationFilter)?entry(c,i,variant==='C'):'').join('')||'<p class="empty">No vessels need attention here.</p>'}</section>`}
function board(){return `<section><h3>Culture board</h3><p class="muted">All active vessels, grouped by stage.</p><div class="board">${['Introduction','Multiplication','Rooting'].map(stage=>`<div><h4>${stage}</h4>${cultures.map((c,i)=>c.stage===stage?entry(c,i):'').join('')}</div>`).join('')}</div></section>`}
function media(){return `<section><div class="row"><h3>Culture Medium library</h3><button data-edit="medium">New medium</button></div><p class="muted">Versioned recipes available across all cultures.</p>${['MS multiplication','Half-strength MS rooting','MS introduction'].map((n,i)=>`<article class="entry"><div class="row"><h3>${n}</h3><button data-edit="medium">Edit medium</button></div><p>Version ${i?1:3} · ${i?1:3} saved ${i?'version':'versions'}</p></article>`).join('')}</section>`}
function pairings(){return `<section><div class="row"><h3>Pairings</h3><button data-edit="pairing">Add pairing</button></div><p class="muted">Curated phenotype and Culture Medium combinations.</p>${['Blue Dream #3','OG Kush #1'].map(n=>`<article class="entry"><h3>${n}</h3><p>MS multiplication · Multiplication</p><button data-edit="pairing">Edit pairing</button></article>`).join('')}</section>`}
function form(){const c=cultures[selected];if(action==='medium'||action==='pairing')return `<form id="form"><h3>${action==='medium'?'Edit Culture Medium':'Edit pairing'}</h3><p class="muted">Prototype editor · saved only for this interaction.</p>${action==='medium'?'<label>Name<input required value="MS multiplication"></label><label>Recipe notes<textarea rows="4">Illustrative recipe notes</textarea></label>':'<label>Phenotype<select><option>Blue Dream #3</option><option>OG Kush #1</option></select></label><label>Culture Medium<select><option>MS multiplication</option><option>Half-strength MS rooting</option></select></label>'}${formButtons('Save draft')}</form>`;return `<form id="form"><h3>${action==='note'?'Add note':'Replate'} · ${c.name}</h3><p class="muted">${c.id} · ${c.location}</p><p>${action==='note'?'Record an observation against this vessel.':'Replating ends this vessel and creates its successors. Choose a medium for the new vessel.'}</p>${action==='replate'?'<div class="formgrid"><label>Culture Medium<select><option>MS multiplication · v3</option><option>Half-strength MS rooting · v1</option></select></label><label>Plantlets<input required type="number" min="1" value="8"></label><label>Vessel label<input required value="BD-018"></label><label>Location<input value="Shelf A"></label></div>':''}<label>Note ${action==='note'?'':'(optional)'}<textarea rows="3" ${action==='note'?'required':''}></textarea></label><details><summary>Vessel history</summary><p class="muted">Aug 6 · Introduced<br>Aug 28 · Replated onto MS multiplication v3</p></details>${formButtons('Record action')}</form>`}
function formButtons(text){return `<div class="formActions"><button type="button" data-back>Cancel</button><button class="primary" type="submit">${text}</button></div>`}
function detail(){let c=cultures[selected];return `<aside class="details" tabindex="-1"><h3>${c.name}</h3><p class="muted">${c.id} · ${c.location}</p><p>${c.stage}<br>${c.n} plantlets<br>${c.due}</p><div class="actions"><button data-action="replate" data-id="${selected}">Replate</button><button data-action="note" data-id="${selected}">Add note</button></div></aside>`}
function render(){const pages={Worklist:worklist,Cultures:board,Media:media,Pairings:pairings};let body=action&&variant!=='A'?`<button class="back" data-back>Back to ${tab}</button>${form()}`:variant==='A'?worklist()+board()+media()+pairings():variant==='C'&&tab==='Worklist'?`<div class="bench">${worklist()}${detail()}</div>`:pages[tab]();$('#layout').innerHTML=variant==='C'?`<div class="split">${action?'':nav()}<div class="content">${body}</div></div>`:`${variant==='B'&&!action?nav():''}<div class="content">${body}</div>`;if(message)$('.content').insertAdjacentHTML('afterbegin',`<p role="status" class="notice">${message}</p>`);$('#variantLabel').textContent=variants[variant][0];$('#rationale').textContent=variants[variant][1];$('#state').textContent=`${action?'Editing '+action:tab} · ${innerWidth<=600?'phone':'desktop'} · ${action?'draft open':'browsing'}`;$('#foot').textContent='Illustrative data · '+(variant==='A'?'Header fixed; the entire card scrolls.':'Header and navigation fixed; content scrolls.');}
function setVariant(step){if(action)return;variant=['A','B','C'][(['A','B','C'].indexOf(variant)+step+3)%3];history.replaceState(null,'','?variant='+variant);tab='Worklist';message='';render()}
function begin(kind,id,trigger){returnScroll=$('.content').scrollTop;returnButton=trigger?.outerHTML;selected=Number(id||0);action=kind;message='';if(variant==='A'){child.innerHTML=form();child.showModal()}else{render();$('.back').focus()}$('#prev').disabled=$('#next').disabled=true}
function back(saved=false){if(child.open)child.close();action=null;message=saved?'Prototype action recorded. No Home Assistant data was changed.':'';render();$('.content').scrollTop=returnScroll;const restored=[...tc.querySelectorAll('button')].find(b=>b.outerHTML===returnButton);restored?.focus();$('#prev').disabled=$('#next').disabled=false}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;message='';render()}if(b.dataset.action)begin(b.dataset.action,b.dataset.id,b);if(b.dataset.edit)begin(b.dataset.edit,0,b);if(b.dataset.select){selected=Number(b.dataset.select);render();$('.details').scrollIntoView({block:'nearest'});$('.details').focus({preventScroll:true})}if(b.hasAttribute('data-back'))back();if(b.id==='upcoming'){upcoming=!upcoming;render()}if(b.id==='prev')setVariant(-1);if(b.id==='next')setVariant(1)});
document.addEventListener('change',e=>{if(e.target.id==='location'){locationFilter=e.target.value;render()}});document.addEventListener('submit',e=>{e.preventDefault();back(true)});
function close(){if(action){back();return}tc.close()}$('#close').onclick=close;tc.addEventListener('cancel',e=>{e.preventDefault();close()});child.addEventListener('cancel',e=>{e.preventDefault();back()});$('#open').onclick=()=>{tab='Worklist';message='';render();tc.showModal()};document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||action)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setVariant(e.key==='ArrowRight'?1:-1)}});render();tc.showModal();
</script></html>
