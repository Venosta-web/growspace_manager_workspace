---
name: Workspace quality

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    workspace-quality-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    name: Workspace contracts and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: E2E entity coverage contract
        run: python -m unittest e2e.test_entity_coverage -v
      - name: Workspace tooling and simulated Vision runtime
        run: >-
          node --test
          scripts/check.test.cjs
          scripts/e2e-ensure-integration.test.cjs
          scripts/e2e-preflight.test.cjs
          scripts/gen-e2e-dashboards.test.cjs
          scripts/install-hooks.test.cjs
          scripts/stamp-card-resource.test.cjs
          scripts/tc-tooling.test.cjs
          scripts/vision-runtime.test.cjs
          scripts/vision-v1-acceptance.test.cjs
          scripts/worktree-gc.test.cjs
