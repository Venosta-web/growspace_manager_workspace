---
name: Workspace quality

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel only an older run for this workflow and this PR. Push and manual
  # runs keep their branch/ref group and are never cancelled here.
  group: >-
    validation-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    name: Workspace contracts and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: E2E entity coverage contract
        run: python -m unittest e2e.test_entity_coverage -v
      # A glob, not a list. The hand-written list this replaced had silently
      # dropped `card-node-modules.test.cjs` — nine passing tests that no CI run
      # had ever executed — because adding a test file and adding it here are two
      # actions and only the first is obvious.
      - name: Workspace tooling and simulated Vision runtime
        run: node --test "scripts/**/*.test.cjs"
