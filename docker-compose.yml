# Growspace development runtime.
#
# Design rule: NOTHING lives only inside a container. Every path HA reads or
# writes is a host bind mount under this workspace or one of the product repos,
# so Claude Code, Codex, ripgrep, your editor and your browser all see the
# same bytes. That is the whole point of this file.
#
#   dev  -> http://localhost:8123   live-mounted source, your daily loop
#   test -> http://localhost:8124   virgin config, HACS install verification
#
# Usage: ./scripts/ha dev up | logs | restart | reload | shell | down

name: growspace

x-ha-common: &ha-common
  image: homeassistant/home-assistant:stable
  # Run as you (1000:1000) so files HA creates stay editable from the host.
  #
  # GROWSPACE_HA_USER exists for CI, where "you" is not uid 1000: a GitHub
  # runner is 1001, and the container and the tooling driving it have to write
  # the same bind-mounted config directory as the same user or each takes turns
  # locking the other out of directories the other created.
  user: "${GROWSPACE_HA_USER:-1000:1000}"
  environment:
    TZ: Europe/Berlin
  restart: unless-stopped
  # NOTE: do NOT set `init: true` here. The homeassistant image runs s6-overlay,
  # which fatals with "can only run as pid 1" if docker inserts its own init.

services:
  # ---------------------------------------------------------------------
  # VISION DEV — the production App image with host-owned App options.
  # ---------------------------------------------------------------------
  vision-dev:
    image: ${GROWSPACE_VISION_IMAGE:-growspace-vision:1.0.0-amd64}
    pull_policy: never
    container_name: growspace-vision-dev
    restart: unless-stopped
    read_only: true
    env_file:
      - path: ./vision-dev/service.env
        required: false
        format: raw
    ports:
      - "127.0.0.1:${GROWSPACE_VISION_PORT:-8099}:8099"
    volumes:
      - ./vision-dev:/data:ro
    tmpfs:
      - /run:rw,exec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8099/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  # ---------------------------------------------------------------------
  # DEV — the instance you develop against all day.
  # ---------------------------------------------------------------------
  ha-dev:
    <<: *ha-common
    container_name: growspace-ha-dev
    ports:
      - "8123:8123"
    depends_on:
      vision-dev:
        condition: service_healthy
    volumes:
      # Whole config dir on the host: .storage/, logs, DB, www — all visible.
      - ./ha-dev:/config

      # The integration, mounted live from its repo. Edit Python in VS Code,
      # reload the integration in HA, done. No copy step, no HACS round-trip.
      #
      # GROWSPACE_BACKEND_SRC serves a worktree's integration instead, the way
      # GROWSPACE_CARD_DIST serves a worktree's bundle. Without it a backend
      # worktree cannot be exercised against :8123 at all — the runtime would
      # keep serving the main checkout while you tested the wrong code.
      - ${GROWSPACE_BACKEND_SRC:-../growspace_manager/custom_components/growspace_manager}:/config/custom_components/growspace_manager

      # Optional Tissue Culture companion integration. scripts/ha selects the
      # main TC checkout once its scaffold exists; until then this points at an
      # empty host-owned placeholder. Override it to serve a TC worktree.
      - ${GROWSPACE_TC_SRC:-./ha-dev/custom_components/growspace_manager_tc}:/config/custom_components/growspace_manager_tc

      # The card's rollup output, mounted at the exact path HACS would use.
      # `npm run watch` writes dist/ -> file is live -> hard-refresh browser.
      - ${GROWSPACE_CARD_DIST:-../lovelace-growspace-manager-card/dist}:/config/www/community/lovelace-growspace-manager-card:ro

  # ---------------------------------------------------------------------
  # TEST — clean-room release verification. Deliberately NO source mounts.
  # Install release candidates through HACS here before you tag a release.
  # ---------------------------------------------------------------------
  ha-test:
    <<: *ha-common
    container_name: growspace-ha-test
    profiles: ["test"]          # only starts with: --profile test
    ports:
      - "8124:8123"
    volumes:
      - ./ha-test:/config
